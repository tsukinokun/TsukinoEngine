# TsukinoEngine の Android ビルドの設定
#
# tsukino.cmakeLists : アプリの CMakeLists.txt（tsukino_add_app を呼ぶもの）。既定はエンジン自身（Sandbox）
# tsukino.assetRoot  : APK の assets/ へ入れるフォルダ。デスクトップでの作業フォルダと同じ並び
#                      （Tsukino.BuiltIn/Assets・ゲームの Assets・Cache）にしておく。既定はエンジンのフォルダ
# tsukino.shaderc    : この PC 用の shaderc（Windows か macOS で CMake のビルドをすると .build 以下に作られる）
# tsukino.appId      : アプリの ID
#
# 値は -P で上書きできる（例: gradlew assembleDebug -Ptsukino.cmakeLists=C:/MyGame/CMakeLists.txt）
tsukino.cmakeLists=../../CMakeLists.txt
tsukino.assetRoot=../../.build/android-assets
tsukino.shaderc=
tsukino.appId=jp.tsukino.sandbox

android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g
